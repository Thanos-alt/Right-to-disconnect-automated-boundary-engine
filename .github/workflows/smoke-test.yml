name: CI — Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Seed demo data
        run: npm run seed:demo
      - name: Start server in background
        run: |
          nohup node server.js > server.log 2>&1 &
          sleep 3
      - name: Wait for server
        run: |
          for i in {1..10}; do
            curl -sS http://localhost:4000/api/dashboard/analytics && break || sleep 1;
          done
      - name: Run smoke test
        env:
          BASE_URL: http://localhost:4000
        run: npm run smoke
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtdabe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rtdabe-frontend
  template:
    metadata:
      labels:
        app: rtdabe-frontend
    spec:
      containers:
        - name: frontend
          image: rtdabe-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rtdabe-frontend
spec:
  selector:
    app: rtdabe-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rtdabe-ingress
spec:
  rules:
    - host: rtdabe.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rtdabe-frontend
                port:
                  number: 80

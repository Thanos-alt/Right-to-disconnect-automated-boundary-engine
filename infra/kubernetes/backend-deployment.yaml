apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtdabe-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rtdabe-backend
  template:
    metadata:
      labels:
        app: rtdabe-backend
    spec:
      containers:
        - name: backend
          image: rtdabe-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: rtdabe-backend-config
            - secretRef:
                name: rtdabe-backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: rtdabe-backend
spec:
  selector:
    app: rtdabe-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
